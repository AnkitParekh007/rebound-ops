[package]
name = "reboundops-desktop"
version = "0.2.0"
description = "ReboundOps desktop app: a native window around the local ReboundOps server"
authors = ["Ankit Parekh"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "reboundops_desktop"
path = "src/lib.rs"

[[bin]]
name = "reboundops"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
