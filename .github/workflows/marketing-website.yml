name: Marketing website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit supersedes an older build; PRs have their own group.
concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Capture current app and build marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked app and capture dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix workspace --ignore-scripts --no-audit --no-fund
      - name: Run application tests
        run: npm test
      - name: Compile the recovery frontend
        run: npm run build:web
      - name: Test screenshot artifact validation
        run: node --test marketing-website/tests/*.test.mjs
      - name: Install the matching screenshot browser
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Capture current product views with synthetic data
        env:
          MARKETING_SCREENSHOTS_DIR: ${{ runner.temp }}/marketing-screenshots
        run: node marketing-website/scripts/capture-screenshots.mjs
      - name: Read GitHub Pages path
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build with fresh commit-matched screenshots
        env:
          MARKETING_SCREENSHOTS_DIR: ${{ runner.temp }}/marketing-screenshots
          MARKETING_REQUIRE_FRESH_SCREENSHOTS: "true"
          MARKETING_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node marketing-website/build.mjs
          node marketing-website/check.mjs
      - name: Upload reviewable site and screenshot provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketing-site-${{ github.sha }}
          path: marketing-website/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Package production Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: marketing-website/dist
      - name: Summarize verified build
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo '### Marketing site built'
            echo "Source commit: $SOURCE_SHA"
            echo 'Captured start, directions, plan, evidence, search workbench, scan and tracker from this app commit with fictional data and AI disabled.'
            echo 'The review artifact includes screenshots-manifest.json with capture time, source commit and image hashes.'
            echo 'Only main publishes. Pull requests never deploy production.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
