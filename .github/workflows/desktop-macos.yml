name: Desktop macos source-shell checks
on:
  push:
    branches: ['feature/macos-app']
  pull_request:
    paths: ['desktop/**', 'docs/desktop-macos.md', '.github/workflows/desktop-macos.yml']
permissions:
  contents: read
jobs:
  desktop-shell:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate common shell syntax and security controls
        run: |
          node --check desktop/app.cjs
          node --test desktop/*.test.cjs
      - name: Confirm desktop manifest is platform-shared
        run: node -e "const p=require('./desktop/package.json');if(!p.build.mac||!p.build.win)process.exit(1)"
