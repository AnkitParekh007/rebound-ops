name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check application files
        run: |
          node --check src/core.mjs
          node --check src/app.mjs
          node --check src/demo.mjs
          node --check scripts/serve.mjs
