name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

# A new commit on a pull request supersedes the run for the previous one, so
# that run is cancelled and frees its runners (macOS concurrency is limited).
# Pushes to main always run to completion: they upload and attest the candidate.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    # Pin the browser-test OS rather than inheriting a new ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Review dependency licenses and npm security advisories
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-prod.json" || true
          npm audit --json > "$RUNNER_TEMP/npm-audit-full.json" || true
          npm run review:deps -- "$RUNNER_TEMP/npm-audit-prod.json" "$RUNNER_TEMP/npm-audit-full.json"
      - name: Install job-search workspace dependencies for journey regression tests
        run: npm ci --prefix workspace --ignore-scripts --no-audit --no-fund
      - name: Test discovery outcomes, work-model evidence and safe career backups
        run: node --test workspace/tests/readiness-remediation.test.mjs workspace/tests/scan-consolidated.test.mjs workspace/tests/sources-greenhouse-offices.test.mjs workspace/tests/reboundops-bridge.test.mjs
      - name: Test contracts, API and preserved manual pilot
        run: npm test
      - name: Compile Angular production application
        run: npm run build:web
      - name: Use the official Ubuntu archive for browser dependencies
        # The runner's Azure mirror stalled for minutes per media package.
        # Keep Ubuntu signatures/trust; change only the mirror transport.
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - name: Install browser system dependencies
        # Do not wrap apt in the browser-download retry timeout: killing the
        # unprivileged wrapper can leave sudo apt holding dpkg's lock.
        timeout-minutes: 8
        run: npx playwright install-deps chromium firefox webkit
      - name: Download Chromium, Firefox and WebKit for browser tests
        # Browser downloads occasionally stall (seen in 2 of ~10 runs; a healthy
        # install takes under a minute). Bound each attempt and retry instead of
        # failing or hanging the whole build.
        timeout-minutes: 11
        run: |
          for attempt in 1 2 3; do
            if timeout 180 npx playwright install chromium firefox webkit; then
              exit 0
            fi
            echo "::warning::Playwright browser install attempt $attempt failed or stalled; retrying"
            sleep 10
          done
          echo "::error::Playwright browser install failed after 3 attempts"
          exit 1
      - name: Run cross-browser end-to-end and accessibility tests
        timeout-minutes: 12
        run: npm run test:e2e
      - name: Verify fresh local launcher, PDF export and tracker writes
        timeout-minutes: 6
        run: node scripts/smoke-local-launch.mjs
      - name: Audit release inputs for accidental private files
        run: npm run audit:release
      - name: Check legacy browser prototype
        run: |
          node --check src/app.mjs
          node --check src/demo.mjs
          node --check scripts/serve.mjs
      - name: Build unpublished developer-preview candidate
        run: npm run package:preview
      - name: Verify extracted candidate and production-only startup
        run: npm run smoke:preview
      - name: Upload verified candidate for review (main only, no release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reboundops-v0.2.0-rc1-${{ github.sha }}
          path: |
            dist/preview/reboundops-v0.2.0-rc1-*.tar.gz
            dist/preview/reboundops-v0.2.0-rc1-*.tar.gz.sha256
            dist/preview/reboundops-v0.2.0-rc1-*.cdx.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Show candidate download instructions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo '### Unpublished local developer-preview candidate' >> "$GITHUB_STEP_SUMMARY"
          echo 'After **all CI jobs pass**, download artifact `reboundops-v0.2.0-rc1-${{ github.sha }}` from this run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The artifact is a ZIP containing a `.tar.gz` and its `.sha256` checksum. Retained for 14 days.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is not a GitHub Release, public deployment, npm publication or beta authorization.' >> "$GITHUB_STEP_SUMMARY"

  attest-preview:
    # Signed SLSA build provenance and SBOM attestations for the exact archive
    # built and smoke-tested above. Separate job so only it holds id-token and
    # attestations write; runs on main pushes only (never on pull requests).
    name: Attest preview candidate (provenance + SBOM)
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the verified candidate from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reboundops-v0.2.0-rc1-${{ github.sha }}
          path: preview
      - name: Re-check archive checksum and locate the SBOM
        id: files
        working-directory: preview
        run: |
          sha256sum -c reboundops-v0.2.0-rc1-*.tar.gz.sha256
          sboms=(reboundops-v0.2.0-rc1-*.cdx.json)
          test "${#sboms[@]}" -eq 1 && test -f "${sboms[0]}"
          echo "sbom=preview/${sboms[0]}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: preview/reboundops-v0.2.0-rc1-*.tar.gz
      - name: Attest CycloneDX SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: preview/reboundops-v0.2.0-rc1-*.tar.gz
          sbom-path: ${{ steps.files.outputs.sbom }}
      - name: Show verification commands
        run: |
          {
            echo '### Attested preview candidate'
            echo 'Provenance and SBOM attestations were recorded for the archive in artifact `reboundops-v0.2.0-rc1-${{ github.sha }}`.'
            echo 'Verify after download (GitHub CLI):'
            echo '```sh'
            echo 'gh attestation verify reboundops-v0.2.0-rc1-*.tar.gz --repo ${{ github.repository }}'
            echo 'gh attestation verify reboundops-v0.2.0-rc1-*.tar.gz --repo ${{ github.repository }} --predicate-type https://cyclonedx.org/bom'
            echo '```'
            echo 'This is still not a GitHub Release or publication.'
          } >> "$GITHUB_STEP_SUMMARY"

  platform-package-smoke:
    name: Platform package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Keep temporary files on the runner's work drive (Windows)
        # The smoke tests install the app into a fresh clone and an extracted
        # archive under the OS temp folder. On windows-latest %TEMP% is on C:,
        # where that clone's dependency install took about 3 minutes and the
        # archive's about 75 s; this job's own install on D: takes about 27 s.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Clean locked workspace install
        run: npm ci --no-audit --no-fund
      - name: Check cross-platform integrated launcher prerequisites
        run: npm run doctor
      - name: Unit and API tests
        run: npm test
      - name: Production Angular build
        run: npm run build:web
      - name: Verify local workspace start, stop and restart
        timeout-minutes: 12
        run: node scripts/smoke-local-launch.mjs
      - name: Local preview package (not uploaded or released)
        run: npm run package:preview
      - name: Extract, verify, install and smoke-test
        run: npm run smoke:preview

  node-22-compat:
    # README/engines promise Node 22.x support; verify it on every change.
    name: Node 22 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Clean locked workspace install
        run: npm ci --no-audit --no-fund
      - name: Check cross-platform integrated launcher prerequisites
        run: npm run doctor
      - name: Unit and API tests
        run: npm test
      - name: Production Angular build
        run: npm run build:web
