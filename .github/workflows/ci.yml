name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          NG_CLI_ANALYTICS: 'false'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:smoke
      - run: npm run build
      - run: npm run audit:release
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: reports/sbom.json
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          NG_CLI_ANALYTICS: 'false'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PW_CHANNEL: chromium
