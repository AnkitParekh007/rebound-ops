name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed for the upgrade-from-v0.1.0 check.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          NG_CLI_ANALYTICS: 'false'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:smoke
      # Build the production web app before anything that serves or inspects it.
      - run: npm run build
      - run: npm run test:packaged
      - run: npm run test:exports
      - run: npm run audit:release
        env:
          REBOUND_AUDIT_STRICT: '1'
      # Build the release archive (nothing is published) and verify a fresh install and the v0.1.0 upgrade.
      - run: npm run package:release -- --skip-build
      - run: npm run verify:release
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: reports/sbom.json
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          NG_CLI_ANALYTICS: 'false'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PW_CHANNEL: chromium
      # The same journey against the production build served by the API.
      - run: npm run build
      - run: npm run test:e2e
        env:
          PW_CHANNEL: chromium
          PW_PACKAGED: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
