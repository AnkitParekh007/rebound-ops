name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Test contracts, API and preserved manual pilot
        run: npm test
      - name: Compile Angular production application
        run: npm run build:web
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end and accessibility tests
        run: npm run test:e2e
      - name: Check legacy browser prototype
        run: |
          node --check src/app.mjs
          node --check src/demo.mjs
          node --check scripts/serve.mjs
