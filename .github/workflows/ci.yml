name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Review dependency licenses and npm security advisories
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-prod.json" || true
          npm audit --json > "$RUNNER_TEMP/npm-audit-full.json" || true
          npm run review:deps -- "$RUNNER_TEMP/npm-audit-prod.json" "$RUNNER_TEMP/npm-audit-full.json"
      - name: Test contracts, API and preserved manual pilot
        run: npm test
      - name: Compile Angular production application
        run: npm run build:web
      - name: Install Chromium, Firefox and WebKit for browser tests
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run cross-browser end-to-end and accessibility tests
        run: npm run test:e2e
      - name: Audit release inputs for accidental private files
        run: npm run audit:release
      - name: Check legacy browser prototype
        run: |
          node --check src/app.mjs
          node --check src/demo.mjs
          node --check scripts/serve.mjs
      - name: Build unpublished developer-preview candidate
        run: npm run package:preview
      - name: Verify extracted candidate and production-only startup
        run: npm run smoke:preview
      - name: Upload verified candidate for review (main only, no release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: reboundops-v0.2.0-rc1-${{ github.sha }}
          path: |
            dist/preview/reboundops-v0.2.0-rc1-*.tar.gz
            dist/preview/reboundops-v0.2.0-rc1-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Show candidate download instructions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo '### Unpublished local developer-preview candidate' >> "$GITHUB_STEP_SUMMARY"
          echo 'After **all CI jobs pass**, download artifact `reboundops-v0.2.0-rc1-${{ github.sha }}` from this run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The artifact is a ZIP containing a `.tar.gz` and its `.sha256` checksum. Retained for 14 days.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is not a GitHub Release, public deployment, npm publication or beta authorization.' >> "$GITHUB_STEP_SUMMARY"

  platform-package-smoke:
    name: Platform package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Clean locked workspace install
        run: npm ci --no-audit --no-fund
      - name: Unit and API tests
        run: npm test
      - name: Production Angular build
        run: npm run build:web
      - name: Local preview package (not uploaded or released)
        run: npm run package:preview
      - name: Extract, verify, install and smoke-test
        run: npm run smoke:preview
